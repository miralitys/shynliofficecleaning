services:
  - type: web
    name: shynliofficecleaning
    runtime: static
    repo: https://github.com/miralitys/shynliofficecleaning.git
    branch: main
    buildCommand: node scripts/prepare-onrender-redirect.mjs
    staticPublishPath: ./redirect-origin
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__office_redirect/*
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
