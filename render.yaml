services:
  - type: web
    name: shynliofficecleaning
    runtime: static
    repo: https://github.com/miralitys/shynliofficecleaning.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
